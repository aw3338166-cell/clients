
name: Build Apex Client

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build Apex mod
        run: |
          PROJECT_DIR="$(dirname "$(find . -name build.gradle -not -path '*/.gradle/*' -print -quit)")"
          if [ "$PROJECT_DIR" = "." ] && [ ! -f build.gradle ]; then
            echo "Could not find build.gradle"
            exit 1
          fi
          echo "Building project in $PROJECT_DIR"
          gradle -p "$PROJECT_DIR" build --no-daemon

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apex-client-jar
          path: '**/build/libs/*.jar'
          if-no-files-found: error
